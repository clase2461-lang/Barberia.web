<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Barbería Juan</title>
    <style>
        body { margin: 0; padding: 0; background: #12121e; color: #dcdce6; font-family: 'Segoe UI', sans-serif; }
        .header { background: #1e1e32; padding: 20px; text-align: center; border-bottom: 2px solid #dca032; position: sticky; top: 0; z-index: 100; }
        .header h1 { margin: 0; color: #dca032; font-size: 22px; }
        .welcome { color: #a0a0b4; font-size: 14px; margin-top: 5px; }
        .container { padding: 20px; padding-bottom: 80px; max-width: 800px; margin: 0 auto; }
        .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: #23253a; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #323750; }
        .kpi-value { font-size: 24px; font-weight: bold; color: #dcb464; }
        .kpi-label { font-size: 12px; color: #a0a0b4; margin-top: 5px; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #1e1e32; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #323750; }
        .nav-item { color: #a0a0b4; text-decoration: none; font-size: 14px; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: #dca032; }
    </style>
</head>
<body>
    <div class="header">
        <h1>💈 Barbería Juan</h1>
        <div class="welcome" th:text="'Bienvenido, ' + ${usuario}">Bienvenido</div>
    </div>

    <div class="container">
        <h2>Resumen de Operaciones</h2>
        
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-value" th:text="${citasHoy}">0</div>
                <div class="kpi-label">Citas Pendientes</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value" th:text="'$' + ${ganancias}">$0.0</div>
                <div class="kpi-label">Ganancias Totales</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value" th:text="${totalCitas}">0</div>
                <div class="kpi-label">Total de Citas (Histo)</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value" th:text="${totalClientes}">0</div>
                <div class="kpi-label">Total Clientes</div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="/dashboard" class="nav-item active">🏠 Inicio</a>
        <a href="/citas" class="nav-item">📅 Citas</a>
        <a href="/logout" class="nav-item">🚪 Salir</a>
    </div>
</body>
</html>
