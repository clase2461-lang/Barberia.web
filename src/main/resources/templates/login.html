<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Barbería Juan</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #12121e 0%, #1e1e32 100%);
            color: #dcdce6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: rgba(30, 32, 50, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .login-box h1 {
            color: #dcb464;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .login-box p {
            color: #a0a0b4;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #c8c8dc;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #191b2a;
            border: 1px solid #323750;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-login {
            background: #dca032;
            color: #000;
            border: none;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .error-msg {
            color: #ff6464;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div style="font-size: 50px;">💈</div>
        <h1>Barbería Juan</h1>
        <p>Sistema de Gestión de Citas</p>
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" name="username" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn-login">Iniciar Sesión</button>
            <div th:if="${error}" class="error-msg" th:text="${error}"></div>
        </form>
    </div>
</body>
</html>
